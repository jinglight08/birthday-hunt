<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Hunt</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#FBF3E7',
          creamdeep: '#F3E4D0',
          terracotta: '#D97757',
          terracottadeep: '#C25F40',
          rose: '#E7A9A0',
          rosedeep: '#D98884',
          ink: '#4A3B32'
        },
        fontFamily: {
          display: ['"Playfair Display"', 'serif'],
          body: ['Quicksand', 'sans-serif']
        }
      }
    }
  }

<style>
  body { font-family: 'Quicksand', sans-serif; }
  .font-display { font-family: 'Playfair Display', serif; }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card-enter { animation: floatIn 0.5s ease-out; }

  @keyframes popCheck {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .check-pop { animation: popCheck 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

  @keyframes gentleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .bob { animation: gentleBob 3s ease-in-out infinite; }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .btn-shimmer {
    background-image: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
    background-size: 200% 100%;
    animation: shimmer 2.5s ease-in-out infinite;
  }

  .dot { transition: all 0.35s ease; }

  @keyframes shutterFlicker {
    0% { opacity: 0; }
    20% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }
  .shutter-flicker { animation: shutterFlicker 0.55s ease-in-out forwards; }

  #cameraFlash { transition: opacity 0.15s ease; }
</style>
</head>
<body class="bg-cream min-h-screen flex items-center justify-center p-4 text-ink">

  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-40" style="width:100%;height:100%;"></canvas>
  <div id="cameraFlash" class="fixed inset-0 bg-white pointer-events-none z-50" style="opacity:0;"></div>

  <div class="w-full max-w-md">

    <!-- Page title -->
    <h1 class="font-display text-3xl text-center text-terracottadeep mb-4">The Birthday Hunt</h1>

    <div id="progress" class="flex justify-center gap-2 mb-6"></div>

    <!-- Card container -->
    <div id="cardWrap"></div>

    <!-- Back / Reset nav -->

    // Self-contained — no external library/CDN required, so it can never
    // fail to load. The hunt itself never depends on this succeeding.
    try {
      const colors = ['#D97757', '#E7A9A0', '#F3E4D0', '#C25F40'];
      const count = big ? 160 : 70;
      const w = confettiCanvas.width;

      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: Math.random() * w,
          y: -20 - Math.random() * 100,
          vx: (Math.random() - 0.5) * 4,
          vy: 2 + Math.random() * 3,
          gravity: 0.05 + Math.random() * 0.05,
          size: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.3,
          life: 0,
          maxLife: 160 + Math.random() * 80
        });
      }
      if (!confettiRAF) confettiRAF = requestAnimationFrame(tickConfetti);
    } catch (e) {
      console.warn('Confetti unavailable, continuing without it:', e);
    }
  }

  function tickConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiParticles = confettiParticles.filter(
      p => p.life < p.maxLife && p.y < confettiCanvas.height + 40
    );
    confettiParticles.forEach(p => {
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;
      p.life++;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rotation);
      confettiCtx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      confettiCtx.restore();
    });
    confettiRAF = confettiParticles.length > 0 ? requestAnimationFrame(tickConfetti) : null;
  }

  function renderProgress() {
    const wrap = document.getElementById('progress');
    wrap.innerHTML = cards.map((c, i) => {
      const state = i < current ? 'bg-terracotta' : i === current ? 'bg-rosedeep scale-125' : 'bg-creamdeep';
      return `<div class="dot w-2.5 h-2.5 rounded-full ${state}"></div>`;
    }).join('');
  }

  function baseCardShell(inner) {
    return `
      <div class="card-enter bg-white/80 backdrop-blur rounded-3xl shadow-lg p-7 border border-creamdeep">
        ${inner}
      </div>
    `;
  }

  function renderNav() {
    const nav = document.getElementById('navRow');
    const backHtml = current > 0
      ? `<button id="backBtn" class="text-ink/50 hover:text-terracottadeep transition-colors">← Back</button>`
      : `<span></span>`;
    nav.innerHTML = `
      ${backHtml}
      <button id="resetBtn" class="text-ink/50 hover:text-terracottadeep transition-colors">Reset hunt</button>
    `;
    if (current > 0) {
      document.getElementById('backBtn').addEventListener('click', goBack);
    }
    document.getElementById('resetBtn').addEventListener('click', resetHunt);
  }

  function goBack() {
    current = Math.max(0, current - 1);
    renderCard();
  }

  function resetHunt() {
    if (confirm('Reset the whole hunt back to clue 1?')) {
      current = 0;
      renderCard();
    }
  }

  function renderCard() {
    renderProgress();
    renderNav();
    const wrap = document.getElementById('cardWrap');
    const c = cards[current];

    if (c.type === 'yesno') {
      wrap.innerHTML = baseCardShell(`
        <div class="text-center">
          <div class="text-5xl mb-3 bob">${c.emoji}</div>
          <h2 class="font-display text-2xl text-terracottadeep mb-4">${c.title}</h2>
          <p class="text-sm leading-relaxed text-ink/80 mb-5">${c.message}</p>
          <p id="prompt-${c.id}" class="text-lg mb-6">${c.prompt}</p>
          <button id="yesBtn" class="btn-shimmer relative overflow-hidden bg-terracotta text-white font-semibold py-3 px-8 rounded-full shadow-md hover:bg-terracottadeep transition-colors">
            Yes!
          </button>
          <div id="msgArea-${c.id}" class="mt-5 text-sm leading-relaxed text-ink/80"></div>
          <div id="nextArea-${c.id}" class="mt-5"></div>
        </div>
      `);
      document.getElementById('yesBtn').addEventListener('click', () => {
        fireConfetti(false);
        document.getElementById('yesBtn').remove();
        document.getElementById(`msgArea-${c.id}`).innerHTML = `
          ${c.note ? `<p class="card-enter italic text-ink/60">${c.note}</p>` : ''}
        `;
        document.getElementById(`nextArea-${c.id}`).innerHTML = `
          <button id="continueBtn" class="mt-2 bg-rose text-ink font-semibold py-2.5 px-7 rounded-full shadow hover:bg-rosedeep transition-colors">
            Onward →
          </button>`;
        document.getElementById('continueBtn').addEventListener('click', goNext);
      });
      return;
    }

    // "find" type card
    wrap.innerHTML = baseCardShell(`
      <div class="text-center">
        <div class="text-5xl mb-3 bob">${c.emoji}</div>
        <h2 class="font-display text-2xl text-terracottadeep mb-4">${c.title}</h2>
        <p class="text-lg leading-relaxed italic mb-6">"${c.riddle}"</p>
        <button id="foundBtn" class="btn-shimmer relative overflow-hidden bg-terracotta text-white font-semibold py-3 px-8 rounded-full shadow-md hover:bg-terracottadeep transition-colors">
          Found it!
        </button>
        <div id="foundState-${c.id}" class="mt-5"></div>
      </div>
    `);

    document.getElementById('foundBtn').addEventListener('click', () => {
      const isLast = current === cards.length - 1;
      fireConfetti(isLast);
      document.getElementById('foundBtn').remove();
      document.getElementById(`foundState-${c.id}`).innerHTML = `
        <div class="check-pop text-4xl mb-3">✅</div>
        <p class="text-terracottadeep font-semibold mb-4">Found it!</p>
      `;
      setTimeout(() => {
        if (isLast) {
          renderFinale();
        } else {
          document.getElementById(`foundState-${c.id}`).innerHTML += `
            <button id="continueBtn" class="bg-rose text-ink font-semibold py-2.5 px-7 rounded-full shadow hover:bg-rosedeep transition-colors">
              Next clue →
            </button>`;
          document.getElementById('continueBtn').addEventListener('click', goNext);
        }
      }, 700);
    });
  }

  function goNext() {
    current++;
    renderCard();
  }

  function renderFinale() {
    current = cards.length;
    renderProgress();
    renderNav();
    document.getElementById('cardWrap').innerHTML = baseCardShell(`
      <div class="text-center">
        <div class="text-6xl mb-4 bob">🎉</div>
        <h2 class="font-display text-3xl text-terracottadeep mb-3">Happy Birthday!</h2>
        <p class="text-lg leading-relaxed">Every clue led here because you're worth the whole treasure hunt. Hope today feels as good as you make every day feel for me.</p>
        <p class="mt-5 font-display italic text-terracottadeep text-lg">Love always, Crystal 🤍</p>
        <button id="bonusLinkBtn" class="mt-7 text-sm text-ink/50 hover:text-terracottadeep transition-colors underline underline-offset-4">
          Wait, one more thing →
        </button>
      </div>
    `);
    document.getElementById('bonusLinkBtn').addEventListener('click', renderBonus);
  }

  function flashScreen() {
    const flash = document.getElementById('cameraFlash');
    flash.style.opacity = '0.85';
    setTimeout(() => { flash.style.opacity = '0'; }, 120);
  }

  function playShutterSound() {
    // Synthesized click — no audio file needed. Safe to skip if unsupported.
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioCtx();
      const bufferSize = Math.floor(ctx.sampleRate * 0.06);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      noise.connect(gain).connect(ctx.destination);
      noise.start();
    } catch (e) {
      console.warn('Shutter sound unavailable, continuing without it:', e);
    }
  }

  function renderBonus() {
    renderProgress();
    renderNav();
    const wrap = document.getElementById('cardWrap');
    wrap.innerHTML = baseCardShell(`
      <div class="text-center">
        <div class="text-5xl mb-3 bob">${bonusCard.emoji}</div>
        <h2 class="font-display text-2xl text-terracottadeep mb-4">${bonusCard.title}</h2>
        <p class="text-lg leading-relaxed italic mb-6">"${bonusCard.riddle}"</p>

        <div class="relative inline-block">
          <button id="bonusUnlockBtn" class="btn-shimmer relative overflow-hidden bg-terracotta text-white font-semibold py-3 px-8 rounded-full shadow-md hover:bg-terracottadeep transition-colors">
            Unlock pictures
          </button>
          <div id="shutterOverlay" class="absolute inset-0 rounded-full bg-ink hidden"></div>
        </div>

        <div id="bonusState" class="mt-6"></div>
      </div>
    `);

    document.getElementById('bonusUnlockBtn').addEventListener('click', () => {
      const btn = document.getElementById('bonusUnlockBtn');
      const overlay = document.getElementById('shutterOverlay');

      playShutterSound();
      flashScreen();
      btn.disabled = true;

      overlay.classList.remove('hidden');
      overlay.classList.add('shutter-flicker');

      setTimeout(() => {
        btn.remove();
        overlay.remove();
        document.getElementById('bonusState').innerHTML = `
          <img src="${BONUS_IMAGE}" alt="Two stick figures holding hands under floating hearts" class="check-pop drop-shadow-md" style="display:block; width:170px; max-width:60%; height:auto; margin:0 auto 16px;" />
          <p class="card-enter font-display text-xl text-terracottadeep">That's the preview — the rest unlocks later tonight 😉</p>
        `;
      }, 550);
    });
  }

  renderCard();
</script>

</body>
</html>
